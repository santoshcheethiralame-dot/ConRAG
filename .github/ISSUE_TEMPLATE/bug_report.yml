name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not use this form for security vulnerabilities**: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal documents, questions or requests that show the problem.
      placeholder: |
        1. Ingest ...
        2. Ask ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Judge and embeddings
      options:
        - Offline judge, local embeddings (default)
        - Offline judge, hash embeddings
        - Chat model (Groq, Gemini or OpenRouter)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node version, PGlite or Docker PostgreSQL"
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
